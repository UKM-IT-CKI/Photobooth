<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Photobooth</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- CSS Eksternal (Menggunakan Jinja2 url_for agar path-nya benar di Flask) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">
        <h1>✨PHOTOBOOTH✨</h1>

        <style>
            .ukmit-logo {
                position: absolute;
                left: 18px;
                top: 22px;
                width: 56px;
                height: 56px;
                z-index: 50;
                pointer-events: none;
            }

            .ukmit-logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }

            /* Sesuaikan posisi untuk layar kecil */
            @media (max-width: 600px) {
                .ukmit-logo {
                    left: 12px;
                    top: 14px;
                    width: 40px;
                    height: 40px;
                }
            }
        </style>
        <!-- Area Kamera -->
        <div class="camera-section">
            <video id="video" autoplay playsinline muted></video>
            <img id="singleFrameOverlay" class="frame-overlay" src="/static/frames/frame_single_1.png"
                alt="Frame Overlay">
            <div id="flash" class="flash"></div>
            <div id="countdown" class="countdown-overlay">3</div>
        </div>

        <!-- Area Kontrol -->
        <div class="controls-section">

            <div class="control-group">
                <label>Pilih Tema</label>
                <div class="options-grid theme-options" id="themeOptions">
                    <button class="option-btn theme-option active" data-value="1" aria-pressed="true" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_1.png') }}" alt="" loading="lazy">
                        <span>Comic</span>
                    </button>
                    <button class="option-btn theme-option" data-value="2" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_2.png') }}" alt="" loading="lazy">
                        <span>Alien</span>
                    </button>
                    <button class="option-btn theme-option" data-value="3" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_3.png') }}" alt="" loading="lazy">
                        <span>Astronaut</span>
                    </button>
                    <button class="option-btn theme-option" data-value="4" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_4.png') }}" alt="" loading="lazy">
                        <span>Hacker</span>
                    </button>
                    <button class="option-btn theme-option" data-value="5" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_5.png') }}" alt="" loading="lazy">
                        <span>Floral</span>
                    </button>
                    <button class="option-btn theme-option" data-value="6" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_6.png') }}" alt="" loading="lazy">
                        <span>Bunny</span>
                    </button>
                    <button class="option-btn theme-option" data-value="7" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_7.png') }}" alt="" loading="lazy">
                        <span>Racing</span>
                    </button>
                    <button class="option-btn theme-option" data-value="8" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_8.png') }}" alt="" loading="lazy">
                        <span>Galaxy</span>
                    </button>
                    <button class="option-btn theme-option" data-value="9" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_9.png') }}" alt="" loading="lazy">
                        <span>Football</span>
                    </button>
                    <button class="option-btn theme-option" data-value="10" aria-pressed="false" type="button">
                        <img src="{{ url_for('static', filename='frames/frame_single_10.png') }}" alt="" loading="lazy">
                        <span>Arcade</span>
                    </button>
                </div>
            </div>

            <div class="control-group">
                <label>Filter Warna</label>
                <div class="options-grid" id="filterOptions">
                    <button class="option-btn active" data-value="none" aria-pressed="true" type="button">Normal</button>
                    <button class="option-btn" data-value="grayscale(100%)" aria-pressed="false" type="button">BW</button>
                    <button class="option-btn" data-value="sepia(60%)" aria-pressed="false" type="button">Sepia</button>
                    <button class="option-btn" data-value="brightness(1.2) contrast(1.1)" aria-pressed="false" type="button">Bright</button>
                    <button class="option-btn" data-value="sepia(20%) saturate(1.2) brightness(1.05)" aria-pressed="false" type="button">Warm</button>
                    <button class="option-btn" data-value="brightness(1.08) contrast(0.9) saturate(1.1)" aria-pressed="false" type="button">Soft</button>
                    <button class="option-btn" data-value="saturate(1.6) contrast(1.1)" aria-pressed="false" type="button">Vivid</button>
                    <button class="option-btn" data-value="contrast(1.25) saturate(0.9)" aria-pressed="false" type="button">Contrast</button>
                </div>
            </div>

            <button id="captureBtn">MULAI FOTO</button>
        </div>
    </div>

    <!-- Modal Hasil -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent); font-family: 'Bangers'; letter-spacing: 1px;">FOTO SELESAI!</h2>
            <img id="resultImage" class="result-img" src="" alt="Result">

            <div class="modal-buttons">
                <a id="downloadLink" href="#" download class="btn-secondary">Download Foto</a>
                <button id="retakeBtn" class="btn-outline">Ulang Sesi</button>
            </div>
        </div>
    </div>

    <!-- JS Eksternal -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
